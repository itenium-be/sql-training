server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 64k;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 30s;

  location = /api {
    return 301 /api/;
  }

  location ~ ^/api/exercises/(check|hint|cost) {
    return 404;
  }

  location /api/ {
    proxy_pass http://back-end:8080/;
  }

  location /leaderboard/ {
    proxy_pass http://leaderboard:8000/;
  }

  # Dev-only: the deck runs on slidev's own dev server (:3030, published to the
  # host). Reverse-proxying it breaks either its root-based asset paths or its
  # --remote sync state, so redirect the browser there instead — :3030 is on the
  # same host the nav link was loaded from. Prod serves the built deck from nginx
  # under /slides/ (see nginx.conf).
  location /slides {
    return 302 $scheme://$host:3030/;
  }

  location / {
    proxy_pass http://front-end:3000;
  }
}
