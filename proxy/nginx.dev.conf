server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 64k;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 30s;

  location = /api {
    return 301 /api/;
  }

  location ~ ^/api/exercises/(check|hint|cost) {
    return 404;
  }

  location /api/ {
    proxy_pass http://back-end:8080/;
  }

  location /leaderboard/ {
    proxy_pass http://leaderboard:8000/;
  }

  location = /slides {
    return 301 /slides/;
  }

  # Dev-only: slidev runs its own server on :3030 under --base /slides/, so the
  # prefix is kept (no trailing slash on proxy_pass) and the HMR websocket is
  # upgraded. Prod serves the built deck from nginx on :80 with the prefix
  # stripped instead — see nginx.conf.
  # slidev's --remote sync endpoints live at the root, not under --base, so
  # they need their own route to the dev server.
  location /@server-reactive/ {
    proxy_pass http://slides:3030;
    proxy_set_header Host $host;
  }

  location /slides/ {
    proxy_pass http://slides:3030;
    # A proxy_set_header here drops the server-level set, so Host is restated
    # or vite's host check 403s the upstream name.
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location / {
    proxy_pass http://front-end:3000;
  }
}
