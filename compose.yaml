name: sql-training

services:
  proxy:
    image: nginx:1.30-alpine
    restart: always
    ports:
      - ${HTTP_PORT:-80}:80
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - front-end
      - back-end
      - leaderboard
      - slides
    networks:
      - trainnet

  slides:
    build: ./slides
    restart: always
    networks:
      - trainnet

  front-end:
    build:
      context: ./sql-front
      dockerfile: Dockerfile
    restart: always
    networks:
      - trainnet

  back-end:
    build:
      context: ./sql-back
      dockerfile: Dockerfile
    restart: always
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: player
      PG_PASSWORD: player
      SQL_SERVER_HOST: sqlserver
      SQL_SERVER_PORT: 1433
      SQL_SERVER_USER: player
      SQL_SERVER_PASSWORD: Player123!
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-internal}
    networks:
      - trainnet

  leaderboard:
    build:
      context: ./sql-leaderboard
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: 8000
      HOST: 0.0.0.0
      API_KEY: ${API_KEY:-secret}
      BACK_END_URL: http://back-end:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-internal}
      PG_HOST: leaderboard-db
      PG_PORT: 5432
      PG_USER: admin
      PG_PASSWORD: password
    depends_on:
      - leaderboard-db
    networks:
      - trainnet

  leaderboard-db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: game
      PGDATA: /data/postgres
    volumes:
      - ./sql-data/game.sql:/docker-entrypoint-initdb.d/init.sql
      - leaderboard_data:/data/postgres
    restart: always
    networks:
      - trainnet

  sqlserver:
    build: ./sql-server
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: always
    networks:
      - trainnet

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: world
      PGDATA: /data/postgres
    volumes:
      - ./sql-data/postgres.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./sql-data/postgres-company.sql:/docker-entrypoint-initdb.d/02-company.sql
      - ./sql-data/postgres-player.sql:/docker-entrypoint-initdb.d/03-player.sql
      - postgres:/data/postgres
    restart: always
    networks:
      - trainnet

volumes:
  postgres:
  sqlserver_data:
  leaderboard_data:

networks:
  trainnet:
    driver: bridge
