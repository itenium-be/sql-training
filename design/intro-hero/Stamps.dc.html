<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Option B: three ink stamps</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
body{margin:0;background:#16100a}
a{color:#e9b44c;text-decoration:none}a:hover{color:#f0e2c2}
.stamp{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:176px;height:176px;border-radius:14px;border:3px solid currentColor;box-shadow:inset 0 0 0 2px rgba(0,0,0,0.25);opacity:0.92;mix-blend-mode:screen}
.stamp::after{content:'';position:absolute;inset:9px;border:2px dashed currentColor;border-radius:8px;opacity:0.5}
.stamp b{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;font-size:20px;letter-spacing:0.08em}
.stamp small{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.14em;opacity:0.75}
</style>
</helmet>
<div style="width:100%;min-height:900px;box-sizing:border-box;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#d6c49e;background:radial-gradient(900px 520px at 50% 40%,rgba(201,154,62,0.14),transparent 70%),#16100a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:56px 24px">

  <div style="display:inline-flex;align-items:center;gap:12px;border:1px solid #4a3820;border-radius:999px;padding:10px 22px;margin-bottom:34px;font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#e9b44c">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M3 10h18M8 2v4M16 2v4"></path></svg>
    27 November 2026 · La Fabrique de la Connaissance
  </div>

  <h1 style="margin:0 0 20px;font-weight:800;line-height:1.02;letter-spacing:-0.035em;font-size:clamp(2.8rem,8vw,5.6rem)">
    <span style="display:block;color:#f0e2c2">SQL Showdown</span>
    <span style="display:block;background:linear-gradient(90deg,#c99a3e,#f0e2c2 45%,#e9b44c 80%);-webkit-background-clip:text;background-clip:text;color:transparent">DevFest Paris</span>
    <span style="display:block;background:linear-gradient(90deg,#e9b44c,#c47a35);-webkit-background-clip:text;background-clip:text;color:transparent">Edition.</span>
  </h1>

  <p style="max-width:620px;font-size:clamp(1.05rem,2.4vw,1.3rem);color:#a38e66;margin:0 0 42px">
    Live SQL challenges on Postgres &amp; SQL Server. Every query you land gets stamped:
  </p>

  <div style="display:flex;gap:40px;flex-wrap:wrap;justify-content:center;margin-bottom:46px">
    <div class="stamp" style="color:#a9c97a;transform:rotate(-7deg)">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
      <b>CORRECT</b><small>RIGHT ANSWER</small>
    </div>
    <div class="stamp" style="color:#e9b44c;transform:rotate(4deg)">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4.5 13H11l-1 9 8.5-11H12l1-9z"></path></svg>
      <b>FASTEST</b><small>BEAT THE CLOCK</small>
    </div>
    <div class="stamp" style="color:#d8862f;transform:rotate(-3deg)">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M20 4L8.12 15.88M14.47 14.48L20 20M8.12 8.12L12 12"></path></svg>
      <b>LEANEST</b><small>FEWEST CHARS</small>
    </div>
  </div>

  <button type="button" style="min-height:56px;padding:0 44px;border:0;border-radius:999px;color:#fff;font:800 20px 'Plus Jakarta Sans',sans-serif;background:linear-gradient(90deg,#d8862f,#b2472a);box-shadow:0 10px 30px rgba(216,134,47,0.35);display:inline-flex;align-items:center;gap:12px;cursor:pointer">
    Let's start
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
  </button>

  <div style="margin-top:52px;font-size:14px;color:#a38e66">Brought to you by <a href="https://itenium.be" style="font-weight:700;color:#f0e2c2">itenium</a></div>
</div>
</x-dc>

</html>
