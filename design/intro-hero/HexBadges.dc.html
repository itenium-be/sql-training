<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Option C: hexagon medals</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
body{margin:0;background:#16100a}
a{color:#e9b44c;text-decoration:none}a:hover{color:#f0e2c2}
.hex{width:150px;height:166px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:flex;align-items:center;justify-content:center}
.hex-outer{background:linear-gradient(160deg,#e9b44c,#c47a35)}
.hex-inner{width:138px;height:152px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#1f170f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.medal b{font-weight:800;font-size:17px;color:#f0e2c2;letter-spacing:-0.01em}
.medal small{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:#e9b44c;letter-spacing:0.08em}
</style>
</helmet>
<div style="width:100%;min-height:900px;box-sizing:border-box;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#d6c49e;background:radial-gradient(900px 520px at 50% 40%,rgba(201,154,62,0.14),transparent 70%),#16100a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:56px 24px">

  <div style="display:inline-flex;align-items:center;gap:12px;border:1px solid #4a3820;border-radius:999px;padding:10px 22px;margin-bottom:34px;font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#e9b44c">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M3 10h18M8 2v4M16 2v4"></path></svg>
    27 November 2026 · La Fabrique de la Connaissance
  </div>

  <h1 style="margin:0 0 20px;font-weight:800;line-height:1.02;letter-spacing:-0.035em;font-size:clamp(2.8rem,8vw,5.6rem)">
    <span style="display:block;color:#f0e2c2">SQL Showdown</span>
    <span style="display:block;background:linear-gradient(90deg,#c99a3e,#f0e2c2 45%,#e9b44c 80%);-webkit-background-clip:text;background-clip:text;color:transparent">DevFest Paris</span>
    <span style="display:block;background:linear-gradient(90deg,#e9b44c,#c47a35);-webkit-background-clip:text;background-clip:text;color:transparent">Edition.</span>
  </h1>

  <p style="max-width:620px;font-size:clamp(1.05rem,2.4vw,1.3rem);color:#a38e66;margin:0 0 44px">
    Live SQL challenges on Postgres &amp; SQL Server. Three medals on every round:
  </p>

  <div style="display:flex;gap:48px;flex-wrap:wrap;justify-content:center;align-items:flex-start;margin-bottom:48px">
    <div class="medal" style="display:flex;flex-direction:column;align-items:center;gap:14px">
      <div class="hex hex-outer"><div class="hex-inner">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#a9c97a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
      </div></div>
      <div><b>Correct</b><br><small>the right rows</small></div>
    </div>
    <div class="medal" style="display:flex;flex-direction:column;align-items:center;gap:14px">
      <div class="hex hex-outer"><div class="hex-inner">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#e9b44c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4.5 13H11l-1 9 8.5-11H12l1-9z"></path></svg>
      </div></div>
      <div><b>Fastest</b><br><small>first to submit</small></div>
    </div>
    <div class="medal" style="display:flex;flex-direction:column;align-items:center;gap:14px">
      <div class="hex hex-outer"><div class="hex-inner">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#d8862f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M20 4L8.12 15.88M14.47 14.48L20 20M8.12 8.12L12 12"></path></svg>
      </div></div>
      <div><b>Leanest</b><br><small>shortest query</small></div>
    </div>
  </div>

  <button type="button" style="min-height:56px;padding:0 44px;border:0;border-radius:999px;color:#fff;font:800 20px 'Plus Jakarta Sans',sans-serif;background:linear-gradient(90deg,#d8862f,#b2472a);box-shadow:0 10px 30px rgba(216,134,47,0.35);display:inline-flex;align-items:center;gap:12px;cursor:pointer">
    Let's start
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
  </button>

  <div style="margin-top:52px;font-size:14px;color:#a38e66">Brought to you by <a href="https://itenium.be" style="font-weight:700;color:#f0e2c2">itenium</a></div>
</div>
</x-dc>

</body>
</html>
