<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tutorial overlay mockups</title><link rel="stylesheet" href="../dashboard/mock.css">
<style>
body { padding: 24px; overflow: auto; }
section { margin-bottom: 48px; }
h2 { font-size: 1.3rem; }
.frames { display: flex; gap: 28px; align-items: flex-start; }
.desk { width: 1100px; height: 640px; border: 1px solid var(--df-border); border-radius: 10px; overflow: hidden; flex: none; }
.desk iframe { width: 1375px; height: 800px; border: 0; transform: scale(.8); transform-origin: 0 0; }
.phone { width: 390px; height: 780px; border: 10px solid #000; border-radius: 40px; overflow: hidden; flex: none; }
.phone iframe { width: 100%; height: 100%; border: 0; }
.lbl { font-size: .75rem; color: var(--df-muted); margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; }
</style></head>
<body>
<h1>Tutorial overlay: cursor, caption, controls</h1>
<p class="muted">Loops 5 exercise-page steps. On the phone the arrow becomes a tap ripple.</p>
<script>
for (const [v, title, note] of [
  ['A', 'A · Spotlight', 'Everything dimmed except the target. Caption card next to it, with the controls inside. Docks at the bottom on phone.'],
  ['B', 'B · Ring',      'No dimming; a pulsing ring around the target. Bubble tethered below/above it; a floating pill with the controls.'],
  ['C', 'C · Subtitles', 'Target glows; caption as cinematic subtitles in a bottom bar with 16 progress segments. Same on phone.'],
  ['D', 'D · Narrator',  'Soft dim; a docked side panel with chapter progress (Dashboard · Intro · Exercise). Bottom sheet on phone.'],
]) {
  document.write(`<section><h2>${title}</h2><p class="muted">${note} <a href="stage.html?v=${v}" style="color:var(--df-gold)">open alone</a></p>
    <div class="frames"><div><div class="lbl">desktop · 1375px @ 80%</div><div class="desk"><iframe src="stage.html?v=${v}"></iframe></div></div>
    <div><div class="lbl">phone · 370px</div><div class="phone"><iframe src="stage.html?v=${v}"></iframe></div></div></div></section>`);
}
</script>
</body></html>
